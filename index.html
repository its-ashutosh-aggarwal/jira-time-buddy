<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira Time Buddy</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f6fa;
      margin: 0;
      color: #172b4d;
    }
    main {
      max-width: 760px;
      margin: 70px auto;
      padding: 30px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #172b4d12;
    }
    h1 { color: #2563eb; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Jira Time Buddy</h1>
      <p>Never forget to log an unplanned client call again.</p>
      <h2>Your smart worklog assistant</h2>
      <p>We're building a simple way to capture Microsoft Teams
      client calls and submit accurate worklogs to Jira.</p>
      <button onclick="alert('Jira integration coming soon!')">
        Get started
      </button>
      <p><small>Version 0.1 · Initial prototype</small></p>
    </div>
  </main>
</body>
</html>
